<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Markdown Viewer</title>
    <style>
        :root {
            color-scheme: light dark;
            --bg: #ffffff;
            --fg: #1a1a1a;
            --muted: #666666;
            --border: #dddddd;
            --code-bg: #f5f5f5;
            --link: #0366d6;
        }
        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #1a1a1a;
                --fg: #e6e6e6;
                --muted: #999999;
                --border: #333333;
                --code-bg: #2a2a2a;
                --link: #58a6ff;
            }
        }
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            background: var(--bg);
            color: var(--fg);
        }
        #content {
            max-width: 800px;
            margin: auto;
        }
        #content a { color: var(--link); }
        #content code,
        #content pre {
            background: var(--code-bg);
            border-radius: 4px;
        }
        #content code { padding: 0.1em 0.3em; }
        #content pre { padding: 0.8em; overflow-x: auto; }
        #content pre code { background: transparent; padding: 0; }
        #content blockquote {
            border-left: 4px solid var(--border);
            color: var(--muted);
            margin: 0;
            padding: 0 1em;
        }
        #content table { border-collapse: collapse; }
        #content th,
        #content td {
            border: 1px solid var(--border);
            padding: 0.4em 0.8em;
        }
        #content hr { border: 0; border-top: 1px solid var(--border); }
    </style>
</head>
<body>
    <div id="content"></div>

    <!-- Include markdown-it from CDN -->
    <script src="https://cdn.jsdelivr.net/npm/markdown-it@13.0.1/dist/markdown-it.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pako/2.0.4/pako.min.js"></script>
    <script>
        // Function to get URL parameter
        function getUrlParameter(name) {
            name = name.replace(/[\[]/, '\\[').replace(/[\]]/, '\\]');
            var regex = new RegExp('[\\?&]' + name + '=([^&#]*)');
            var results = regex.exec(location.search);
            return results === null ? '' : decodeURIComponent(results[1].replace(/\+/g, ' '));
        };

        // Function to decode base64 / base64url
        function base64ToUint8Array(base64) {
            base64 = base64.replace(/-/g, '+').replace(/_/g, '/');
            while (base64.length % 4) base64 += '=';
            var raw = window.atob(base64);
            var rawLength = raw.length;
            var array = new Uint8Array(new ArrayBuffer(rawLength));

            for (var i = 0; i < rawLength; i++) {
                array[i] = raw.charCodeAt(i);
            }
            return array;
        }

        function uint8ArrayToBase64Url(bytes) {
            var binary = '';
            for (var i = 0; i < bytes.length; i++) {
                binary += String.fromCharCode(bytes[i]);
            }
            return window.btoa(binary)
                .replace(/\+/g, '-')
                .replace(/\//g, '_')
                .replace(/=+$/, '');
        }

        // Get the 'md' parameter from the URL
        (async function () {
            var compressedMarkdownText = getUrlParameter('mdz');
            var markdownText;
            
            if (compressedMarkdownText) {
                // Decode the base64 string to a Uint8Array
                var compressedMarkdownData = base64ToUint8Array(compressedMarkdownText);
    
                // Decompress the Uint8Array using pako
                markdownText = pako.inflate(compressedMarkdownData, { to: 'string' });
            }

            if (!markdownText) {
                markdownText = getUrlParameter('md');
            }

            if (!markdownText) {
                markdownText = await (await fetch("README.md")).text();
            }

            // Initialize markdown-it
            var md = window.markdownit({ html: true });

            document.getElementById('content').innerHTML = md.render(markdownText);

            document.addEventListener('paste', function (e) {
                var pasted = (e.clipboardData || window.clipboardData).getData('text');
                if (pasted) {
                    e.preventDefault();
                    var compressed = pako.deflate(pasted, { level: 9 });
                    var encoded = uint8ArrayToBase64Url(compressed);
                    window.location.search = '?mdz=' + encoded;
                }
            });
        })();
    </script>
</body>
</html>
